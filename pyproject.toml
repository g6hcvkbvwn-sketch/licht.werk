[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lichtwerk"
version = "0.1.0"
description = "Local-first club lighting control, starting in simulation mode."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "mido>=1.3,<2",
    "pydantic>=2.8,<3",
    "python-rtmidi>=1.5,<2",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
]

[project.scripts]
lichtwerk = "lichtwerk.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
